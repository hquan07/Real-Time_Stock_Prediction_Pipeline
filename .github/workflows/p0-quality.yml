name: P0 quality gates

on:
  push:
    branches: [main, develop, "upr/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install -r requirements-base.txt
          pytest==8.3.1 pytest-timeout==2.3.1
      - name: Validate repository and Compose
        run: |
          ./scripts/ci/check_secrets.sh
          python -m compileall -q src services scripts tests
          docker compose --env-file .env.example config --quiet
      - name: Run configuration and database unit tests
        env:
          POSTGRES_PASSWORD: test-only-placeholder
        run: >-
          python -m pytest -c tests/pytest.ini
          tests/unit/test_settings.py
          tests/unit/test_db_connection.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  dashboard-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dashboard images
        run: >-
          docker compose --env-file .env.example build
          dashboard-backend dashboard-frontend
