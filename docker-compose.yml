x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
  image: stock-pipeline-airflow:${IMAGE_TAG:-dev}
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    AIRFLOW__WEBSERVER__RBAC: ${AIRFLOW__WEBSERVER__RBAC}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW_HOME: /opt/airflow
    _AIRFLOW_DB_MIGRATE: 'true'
    _AIRFLOW_WWW_USER_CREATE: 'true'
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    PYTHONPATH: /opt/airflow/packages/pipeline/src:/opt/airflow
    PIPELINE_ENV: ${PIPELINE_ENV:-dev}
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./packages/pipeline/src:/opt/airflow/packages/pipeline/src:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./artifacts:/opt/airflow/artifacts
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------
  # POSTGRES FOR AIRFLOW
  # ---------------------------
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 5s
      retries: 5
    restart: always

  # ---------------------------
  # AIRFLOW INIT (runs once to init DB and create user)
  # ---------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow init completed successfully!"
    restart: "no"

  # ---------------------------
  # AIRFLOW WEBSERVER
  # ---------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # ---------------------------
  # AIRFLOW SCHEDULER
  # ---------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: always
    environment:
      <<: *airflow-env
      CLOUDVAULT_BASE_URL: ${CLOUDVAULT_BASE_URL:-http://cloudvault-api}
      CLOUDVAULT_PROJECT_ID: real-time-stock
      CLOUDVAULT_SERVICE_TOKEN: ${CLOUDVAULT_SERVICE_TOKEN:-}
      CLOUDVAULT_CONNECT_TIMEOUT_SECONDS: ${CLOUDVAULT_CONNECT_TIMEOUT_SECONDS:-5}
      CLOUDVAULT_READ_TIMEOUT_SECONDS: ${CLOUDVAULT_READ_TIMEOUT_SECONDS:-60}
      CLOUDVAULT_MAX_RETRIES: ${CLOUDVAULT_MAX_RETRIES:-3}
      CLOUDVAULT_RETRY_BASE_SECONDS: ${CLOUDVAULT_RETRY_BASE_SECONDS:-0.5}
      CLOUDVAULT_MAX_FILE_BYTES: ${CLOUDVAULT_MAX_FILE_BYTES:-104857600}
      CLOUDVAULT_PUBLISH_ENABLED: ${CLOUDVAULT_PUBLISH_ENABLED:-false}
      CLOUDVAULT_MODEL_BUNDLE_MAX_BYTES: ${CLOUDVAULT_MODEL_BUNDLE_MAX_BYTES:-104857600}
      CLOUDVAULT_MODEL_TICKERS: ${CLOUDVAULT_MODEL_TICKERS:-ALL}
      CLOUDVAULT_MODEL_RETENTION_CLASS: ${CLOUDVAULT_MODEL_RETENTION_CLASS:-model}
      CLOUDVAULT_MAX_TEST_RMSE: ${CLOUDVAULT_MAX_TEST_RMSE:-}
      CLOUDVAULT_MAX_TEST_MAE: ${CLOUDVAULT_MAX_TEST_MAE:-}
      CLOUDVAULT_REPORT_PUBLISH_ENABLED: ${CLOUDVAULT_REPORT_PUBLISH_ENABLED:-false}
      CLOUDVAULT_REPORT_RETENTION_CLASS: ${CLOUDVAULT_REPORT_RETENTION_CLASS:-report}
      CLOUDVAULT_REPORT_EXPORT_DIR: ${CLOUDVAULT_REPORT_EXPORT_DIR:-/opt/airflow/artifacts/model-reports}
    networks:
      - default
      - cloudvault-shared

  # ---------------------------
  # KAFKA + ZOOKEEPER
  # ---------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
    ports:
      - "127.0.0.1:2181:2181"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      # Multiple listeners for internal (Docker) and external (host) connections
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Required for a single-broker development stack.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  # ---------------------------
  # SPARK (MASTER + WORKER)
  # ---------------------------
  spark-master:
    build:
      context: .
      dockerfile: infrastructure/docker/spark/Dockerfile
    container_name: spark-master
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_HOST}
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8080:8080"
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master" ]
    volumes:
      - ./data:/opt/data
      - ./models:/opt/models
      - ./src:/opt/app/src
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: always

  spark-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/spark/Dockerfile
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MASTER: spark://spark-master:7077
    ports:
      - "127.0.0.1:8082:8081"
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077" ]
    volumes:
      - ./data:/opt/data
      - ./models:/opt/models
      - ./src:/opt/app/src
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: always

  spark-consumer:
    build:
      context: .
      dockerfile: infrastructure/docker/spark/Dockerfile
    container_name: spark-consumer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-stock_raw_data}
      SPARK_CHECKPOINT_LOCATION: /opt/spark/checkpoints/stock-consumer
      PYTHONPATH: /opt/app/packages/pipeline/src
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-avro_2.12:3.5.3,org.postgresql:postgresql:42.6.0
      - /opt/app/packages/pipeline/src/stock_pipeline/streaming/jobs/spark_consumer_job.py
    volumes:
      - ./packages/pipeline/src:/opt/app/packages/pipeline/src:ro
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/home/spark/.ivy2
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[s]park_consumer_job.py' >/dev/null && test -f /opt/spark/checkpoints/stock-consumer/metadata"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # ---------------------------
  # JUPYTER NOTEBOOK FOR ML + DL
  # ---------------------------
  jupyter:
    image: quay.io/jupyter/pytorch-notebook:latest
    container_name: jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:8888"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
      - ./models:/home/jovyan/models
    restart: always

  # ---------------------------
  # MLFLOW (Model Tracking & Registry)
  # ---------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: mlflow
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    command: mlflow server --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: always

  # ---------------------------
  # REDIS (Caching)
  # ---------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ---------------------------
  # Dashboard Backend (FastAPI)
  # ---------------------------
  dashboard-backend:
    image: stock-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/app/Dockerfile
    container_name: dashboard-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-stockdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost,http://localhost:5173}
      - MODEL_REPORT_DIR=/app/artifacts/model-reports
      - PIPELINE_ENV=${PIPELINE_ENV:-dev}
    volumes:
      - ./src:/app/src
      - ./packages/pipeline/src:/app/packages/pipeline/src:ro
      - ./services/api:/app/services/api
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------
  # Dashboard Frontend (Vite/React)
  # ---------------------------
  dashboard-frontend:
    image: stock-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    container_name: dashboard-frontend
    restart: always
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5173}:8080"
    depends_on:
      dashboard-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

# ---------------------------
# VOLUMES
# ---------------------------
volumes:
  postgres_data:
  postgres_data_backup:
  pgadmin_data:
  redis_data:
  kafka_data:
  mlflow_data:
  spark_checkpoints:
  spark_ivy:

networks:
  cloudvault-shared:
    external: true
    name: cloudvault-shared
