[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marker definitions
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_db: marks tests that require database connection
    requires_kafka: marks tests that require Kafka
    requires_spark: marks tests that require Spark

# Console output
addopts = -v --tb=short --strict-markers

# Coverage
# addopts = -v --tb=short --cov=src --cov-report=html --cov-report=term-missing

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for each test
timeout = 60

# Environment variables for testing
env =
    POSTGRES_HOST=localhost
    POSTGRES_PORT=5432
    POSTGRES_DB=stockdb_test
    POSTGRES_USER=postgres
    POSTGRES_PASSWORD=test-only-placeholder
    KAFKA_BOOTSTRAP_SERVERS=localhost:9092
